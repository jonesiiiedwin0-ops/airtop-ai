[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "airtop-ai"
version = "0.1.0"
description = "Airtop AI official plugin registry and automation platform scaffolding."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "jonesiiiedwin0-ops" }
]

[tool.setuptools.packages.find]
where = ["src"]
